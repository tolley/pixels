version: '3.8'

services:
  web:
    build: ./php
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db
      - mailhog
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: secret
      APP_URL: http://localhost:8080
      JWT_SECRET: dev-secret-change-in-production
      # Google OAuth — create credentials at console.cloud.google.com
      GOOGLE_CLIENT_ID: "631487616394-p0u9u8fqn0rc3rugdg98u00crrpqndpo.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "asd"
      # Apple Sign In — configure at developer.apple.com/account/resources/authkeys
      APPLE_CLIENT_ID: ""      # Services ID, e.g. com.example.pixelplayground.signin
      APPLE_TEAM_ID: ""        # 10-char Team ID from Apple Developer account
      APPLE_KEY_ID: ""         # Key ID of the Sign In with Apple key
      APPLE_PRIVATE_KEY: ""    # base64-encoded contents of the .p8 private key file

  db:
    image: mysql:5.7
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: secret

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — open http://localhost:8025 to read emails

volumes:
  db_data:
